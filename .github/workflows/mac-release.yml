name: Mac build

# Fork-only. Every push to master that touches the Mac app (or the code it reuses)
# builds an Intel and an Apple Silicon DMG and publishes both in one GitHub release.
on:
  push:
    branches: [master]
    paths:
      - "macApp/**"
      - "library/**"
      - "shared/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - ".github/workflows/mac-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-build
  cancel-in-progress: true

jobs:
  build:
    # jpackage bundles the JRE of the machine it runs on, so each architecture needs its own runner
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            label: intel
            resources: macos-x64
            vlc: vlc-3.0.24-intel64.dmg
            vlc_sha256: 1ef6c903e2dc026d4e58ddf7b2a9ed0eb6f8caf80a9a9f46f96490340b962707
          - arch: arm64
            runner: macos-15
            label: apple-silicon
            resources: macos-arm64
            vlc: vlc-3.0.24-arm64.dmg
            vlc_sha256: 64a89d93cdd30b0e97131743e246373db82d6826ea882d265d46d74b136da2b7
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      APP: macApp/build/compose/binaries/main/app/CloudStream.app
      DMG: CloudStream-1.0.${{ github.run_number }}-${{ matrix.label }}.dmg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The in-app player needs libVLC; bundling it means users don't have to install VLC
      - name: Bundle libVLC
        run: |
          set -euo pipefail
          curl -fsSL -o vlc.dmg "https://download.videolan.org/pub/videolan/vlc/3.0.24/macosx/${{ matrix.vlc }}"
          echo "${{ matrix.vlc_sha256 }}  vlc.dmg" | shasum -a 256 -c
          mnt="$(hdiutil attach -nobrowse -readonly vlc.dmg | tail -1 | awk -F'\t' '{print $NF}')"
          dest="macApp/resources/${{ matrix.resources }}/vlc"
          mkdir -p "$dest"
          cp -R "$mnt/VLC.app/Contents/MacOS/lib" "$mnt/VLC.app/Contents/MacOS/plugins" "$dest/"
          hdiutil detach "$mnt"

      - name: Test and build app
        run: ./gradlew :macApp:jvmTest :macApp:createDistributable -PmacAppVersion=1.0.${GITHUB_RUN_NUMBER}

      - name: Check architecture
        run: |
          lipo "$APP/Contents/MacOS/CloudStream" -verify_arch ${{ matrix.arch }}
          lipo "$APP/Contents/runtime/Contents/Home/lib/libjli.dylib" -verify_arch ${{ matrix.arch }}
          lipo "$(find "$APP" -name libvlccore.dylib | head -1)" -verify_arch ${{ matrix.arch }}

      # Apple Silicon refuses to launch unsigned code, so sign ad-hoc (no Apple Developer account needed)
      - name: Sign ad-hoc and package DMG
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir dmg-root
          cp -R "$APP" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname CloudStream -srcfolder dmg-root -ov -format UDZO "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: ${{ env.DMG }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="mac-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" *.dmg \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mac build $GITHUB_RUN_NUMBER" \
            --notes "Mac build of ${GITHUB_SHA::7}. Download **-intel.dmg** for Intel Macs or **-apple-silicon.dmg** for M-series Macs. Not notarized: after the first launch, allow it in System Settings → Privacy & Security → Open Anyway. Needs IINA or VLC for playback. See macApp/README.md for what works."
