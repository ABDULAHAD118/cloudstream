name: Mac build

# Fork-only. Every push to master that touches the Mac app (or the code it reuses)
# builds an Intel and an Apple Silicon DMG and publishes both in one GitHub release.
on:
  push:
    branches: [master]
    paths:
      - "macApp/**"
      - "library/**"
      - "shared/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - ".github/workflows/mac-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-build
  cancel-in-progress: true

jobs:
  build:
    # jpackage bundles the JRE of the machine it runs on, so each architecture needs its own runner
    strategy:
      matrix:
        include:
          - { runner: macos-15-intel, label: intel }
          - { runner: macos-15, label: apple-silicon }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :macApp:jvmTest

      # Same script as a local build: bundles libVLC, checks the architecture, signs ad-hoc, makes the DMG
      - name: Build DMG
        run: macApp/build-dmg.sh "1.0.${GITHUB_RUN_NUMBER}"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}
          path: macApp/build/CloudStream-*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="mac-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" *.dmg \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CloudStream 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "CloudStream 1.0.${GITHUB_RUN_NUMBER} for Mac, built from ${GITHUB_SHA::7}. Download **-intel.dmg** for Intel Macs or **-apple-silicon.dmg** for M-series Macs. Not notarized: after the first launch, allow it in System Settings → Privacy & Security → Open Anyway. Videos play in the built-in player. See macApp/README.md for what works."
